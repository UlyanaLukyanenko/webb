<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | ÉLAN Dance Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: #FDF9F7;
            color: #2A2A2A;
            padding: 40px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #2A2A2A;
        }
        
        h1:after {
            content: '';
            display: block;
            width: 60px;
            height: 2px;
            background: #B85C5C;
            margin-top: 10px;
        }
        
        h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8rem;
            margin: 30px 0 20px;
            color: #B85C5C;
        }
        
        .back-btn {
            display: inline-block;
            margin-bottom: 30px;
            padding: 10px 25px;
            background: #B85C5C;
            color: white;
            text-decoration: none;
            border-radius: 40px;
            font-size: 0.9rem;
            transition: opacity 0.3s;
        }
        
        .back-btn:hover {
            opacity: 0.85;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .stat-card {
            background: white;
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            text-align: center;
            flex: 1;
            min-width: 150px;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: 600;
            color: #B85C5C;
            font-family: 'Cormorant Garamond', serif;
        }
        
        .stat-label {
            font-size: 0.85rem;
            color: #7A6A6A;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            margin-bottom: 40px;
        }
        
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #F0E6E1;
        }
        
        th {
            background: #B85C5C;
            color: white;
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        tr:hover {
            background: #FDF9F7;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        
        .badge-booking {
            background: #E8F0E6;
            color: #4A7A4A;
        }
        
        .badge-waiting {
            background: #F0E6E6;
            color: #B85C5C;
        }
        
        .clear-btn {
            background: transparent;
            border: 1px solid #D4C5C0;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            margin-left: 15px;
            transition: all 0.3s;
        }
        
        .clear-btn:hover {
            border-color: #B85C5C;
            color: #B85C5C;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 20px;
            }
            table {
                font-size: 0.8rem;
            }
            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← На главную</a>
        <h1>Админ-панель</h1>
        <p>Управление записями и листом ожидания студии ÉLAN</p>
        
        <div class="stats" id="statsContainer">
        </div>
        
        <h2>📋 Активные записи</h2>
        <div style="margin-bottom: 15px;">
            <button class="clear-btn" id="clearBookingsBtn">Очистить все записи</button>
        </div>
        <table id="bookingsTable">
            <thead>
                <tr>
                    <th>Дата и время</th>
                    <th>Занятие</th>
                    <th>Преподаватель</th>
                    <th>Имя</th>
                    <th>Телефон</th>
                    <th>Email</th>
                    <th>Комментарий</th>
                </tr>
            </thead>
            <tbody id="bookingsBody">
                <tr><td colspan="7">Загрузка...</td></tr>
            </tbody>
        </table>
        
        <h2>⏳ Лист ожидания</h2>
        <div style="margin-bottom: 15px;">
            <button class="clear-btn" id="clearWaitingBtn">Очистить лист ожидания</button>
        </div>
        <table id="waitingTable">
            <thead>
                <tr>
                    <th>Дата и время</th>
                    <th>Занятие</th>
                    <th>Преподаватель</th>
                    <th>Имя</th>
                    <th>Телефон</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody id="waitingBody">
                <tr><td colspan="6">Загрузка...</td></tr>
            </tbody>
        </table>
    </div>
    
    <script>
        function loadStats() {
            const bookings = JSON.parse(localStorage.getItem("elan_dance_bookings") || "[]");
            const waiting = JSON.parse(localStorage.getItem("elan_dance_waiting") || "[]");
            
            const statsContainer = document.getElementById("statsContainer");
            statsContainer.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${bookings.length}</div>
                    <div class="stat-label">Всего записей</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${waiting.length}</div>
                    <div class="stat-label">Лист ожидания</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${bookings.length + waiting.length}</div>
                    <div class="stat-label">Всего заявок</div>
                </div>
            `;
        }
        
        function loadBookings() {
            const bookings = JSON.parse(localStorage.getItem("elan_dance_bookings") || "[]");
            const tbody = document.getElementById("bookingsBody");
            
            if (bookings.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#7A6A6A;">Нет активных записей</td></tr>';
                return;
            }
            
            tbody.innerHTML = bookings.reverse().map(booking => `
                <tr>
                    <td>${new Date(booking.timestamp).toLocaleString('ru-RU')}</td>
                    <td>${booking.lessonName}</td>
                    <td>${booking.teacher || '-'}</td>
                    <td>${booking.userName}</td>
                    <td>${booking.userPhone}</td>
                    <td>${booking.userEmail || '-'}</td>
                    <td>${booking.comment || '-'}</td>
                </tr>
            `).join("");
        }
        
        function loadWaiting() {
            const waiting = JSON.parse(localStorage.getItem("elan_dance_waiting") || "[]");
            const tbody = document.getElementById("waitingBody");
            
            if (waiting.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#7A6A6A;">Нет заявок в листе ожидания</td></tr>';
                return;
            }
            
            tbody.innerHTML = waiting.reverse().map(item => `
                <tr>
                    <td>${new Date(item.timestamp).toLocaleString('ru-RU')}</td>
                    <td>${item.lessonName}</td>
                    <td>${item.teacher || '-'}</td>
                    <td>${item.userName}</td>
                    <td>${item.userPhone}</td>
                    <td>${item.userEmail || '-'}</td>
                </tr>
            `).join("");
        }
        
        document.getElementById("clearBookingsBtn")?.addEventListener("click", () => {
            if (confirm("Вы уверены, что хотите очистить все записи? Это действие нельзя отменить.")) {
                localStorage.removeItem("elan_dance_bookings");
                loadBookings();
                loadStats();
                alert("Все записи очищены");
            }
        });
        
        document.getElementById("clearWaitingBtn")?.addEventListener("click", () => {
            if (confirm("Вы уверены, что хотите очистить лист ожидания? Это действие нельзя отменить.")) {
                localStorage.removeItem("elan_dance_waiting");
                loadWaiting();
                loadStats();
                alert("Лист ожидания очищен");
            }
        });
        
        loadStats();
        loadBookings();
        loadWaiting();
    </script>
</body>
</html>
